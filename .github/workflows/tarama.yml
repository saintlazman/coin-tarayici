name: Saatlik coin taramasi
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coin-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: telegram-state.json
          key: telegram-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: telegram-state-
      - name: Alternatif veri erisim testi
        shell: pwsh
        run: |
          $urls = @('https://api.bybit.com/v5/market/open-interest?category=linear&symbol=BTCUSDT&intervalTime=1h&limit=6','https://api.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT','https://www.okx.com/api/v5/public/open-interest?instType=SWAP&instId=BTC-USDT-SWAP','https://www.okx.com/api/v5/public/funding-rate?instId=BTC-USDT-SWAP')
          foreach ($u in $urls) {
            try {
              $r = Invoke-WebRequest -Uri $u -TimeoutSec 15
              "$u : HTTP $($r.StatusCode) | $($r.Content)" >> $env:GITHUB_STEP_SUMMARY
            } catch {
              "$u : HATA $($_.Exception.Response.StatusCode) | $($_.ErrorDetails.Message)" >> $env:GITHUB_STEP_SUMMARY
            }
          }
      - name: Piyasa taramasi
        shell: pwsh
        run: ./tara.ps1
      - name: Telegram bildirimi
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: 'false'
        run: ./telegram.ps1
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: telegram-state.json
          key: telegram-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Tarama ozeti
        if: always()
        shell: pwsh
        run: |
          if (Test-Path son-durum.json) {
            $r = Get-Content son-durum.json -Raw | ConvertFrom-Json
            "Durum: $($r.Durum) | Parite: $($r.Basarili) | Aday: $(@($r.Adaylar).Count)" >> $env:GITHUB_STEP_SUMMARY
          }
